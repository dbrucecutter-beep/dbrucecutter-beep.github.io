name: Update Cafe One80 flyer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the new flyer to the live website?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-flyer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Download flyer from Google Drive folder
        run: |
          python -m pip install --quiet gdown
          mkdir -p /tmp/cafe-drive
          gdown --folder 'https://drive.google.com/drive/folders/14QKGLjYuHLLI2NT6am7f8fT4RzaksBHN' -O /tmp/cafe-drive
          python -c "from pathlib import Path; import shutil; files=list(Path('/tmp/cafe-drive').rglob('flyer.png')); assert len(files)==1, 'Expected exactly one flyer.png'; data=files[0].read_bytes(); assert len(data)>1000 and data.startswith(bytes.fromhex('89504e470d0a1a0a')), 'Invalid PNG'; shutil.copyfile(files[0], '/tmp/cafe-flyer.png')"
      - name: Check for changes
        run: |
          if cmp -s /tmp/cafe-flyer.png images/Flyer.png; then
            echo 'Flyer is identical to the current website image.'
          else
            echo 'New flyer differs from the current website image.'
          fi
      - name: Publish only when explicitly requested
        if: ${{ inputs.publish }}
        run: |
          cp /tmp/cafe-flyer.png images/Flyer.png
          if git diff --quiet -- images/Flyer.png; then
            echo 'No update necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/Flyer.png
          git commit -m 'Update Cafe One80 flyer'
          git push
